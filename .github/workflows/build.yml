name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'live/**'      # live config changes reach the tablet directly, no rebuild needed
      - 'alexa/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Name the APK and write version.json
        run: |
          cp app/build/outputs/apk/release/app-release.apk fire-dashboard.apk
          echo "{\"versionCode\": $((100 + ${{ github.run_number }})), \"versionName\": \"2.${{ github.run_number }}\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: fire-dashboard
          path: fire-dashboard.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest fire-dashboard.apk version.json \
            --title "Fire Dashboard (build ${{ github.run_number }})" \
            --notes "On the tablet, download fire-dashboard.apk and open it to install. Once installed, the dashboard offers new versions itself." \
            --latest
