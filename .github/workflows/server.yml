name: jarvis-core

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install type-checker (dev only; no runtime dependencies)
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t jarvis-core server
      - name: Smoke test
        run: |
          docker run -d --name jarvis-smoke -p 8787:8787 -e ADMIN_PASSWORD=ci-smoke-password jarvis-core
          for i in $(seq 1 20); do curl -fs localhost:8787/api/health && break; sleep 1; done
          docker logs jarvis-smoke
          curl -fs localhost:8787/api/health | grep '"modelStatus":"no_key"'
          curl -fs -o /dev/null localhost:8787/
